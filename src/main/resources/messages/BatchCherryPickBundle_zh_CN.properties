conflict.detail.ours=已保留当前更改解决冲突
conflict.detail.resolveFailed=自动解决冲突失败：{0}
conflict.detail.continueFailed=继续 cherry-pick 失败：{0}

# Dry-run plan
dryrun.plan=将向 {0} 应用 {1} 个 commit
dryrun.pull=将从 {0} 拉取
dryrun.push=将推送到 {0}
dryrun.commit=计划应用
