# Errors
error.selection=未从 Git Log 中获取到可用的 commit 选择。
error.checkout=切换到分支 {0} 失败：{1}
error.dirty=工作区存在未提交更改。请先提交/暂存，或勾选“允许工作区有未提交更改”。

