# Confirmation
confirm.title=确认批量 Cherry-Pick
confirm.message=将把 {0} 个 commit cherry-pick 到 {1} 个分支：{2}。\n\n是否继续？

# Progress
progress.title=正在批量 cherry-pick
progress.title.dryRun=正在预览批量 cherry-pick
progress.branch=正在处理分支：{0}

# Result
result.title=批量 Cherry-Pick 结果
result.title.dryRun=批量 Cherry-Pick 预览
result.summary=已应用：{0}，已跳过：{1}，失败：{2}
result.applied=已应用（{0}）
result.skipped=已跳过（{0}）
result.failed=失败（{0}）

# Notifications
notify.title=批量 Cherry-Pick
notify.summary=已应用：{0}，已跳过：{1}，失败：{2}

# Info / warnings
info.pulled=已拉取 {0}/{1}
info.pushed=已推送到 {0}/{1}
info.aborted.remaining=因前一个 commit 中止了该分支而被跳过
warn.pull.failed=分支 {0} 拉取失败：{1}
